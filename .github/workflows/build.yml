name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

env:
  # Opt every JavaScript action into the Node 24 runtime now, which silences
  # the "Node.js 20 is deprecated" annotation.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    # Pinned on purpose so the ubuntu-latest -> Ubuntu 26 migration can't change the toolchain under you.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Forge 1.20.1 needs JDK 17, Forge 1.21.1 needs JDK 21.
      # Detect the Minecraft version from the project files so this one
      # workflow file works unchanged in both mod repositories.
      - name: Detect Minecraft version and required JDK
        id: mc
        run: |
          if grep -rqE "1\.21(\.1)?" gradle.properties build.gradle 2>/dev/null; then
            echo "java=21" >> "$GITHUB_OUTPUT"
            echo "mc=1.21.1" >> "$GITHUB_OUTPUT"
          else
            echo "java=17" >> "$GITHUB_OUTPUT"
            echo "mc=1.20.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK ${{ steps.mc.outputs.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.mc.outputs.java }}

      # Cache is fully disabled: the GitHub cache service outage (HTTP 400 /
      # "Our services aren't available") can no longer produce save or restore
      # errors. Gradle simply re-downloads what it needs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        continue-on-error: true
        with:
          cache-disabled: true
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The real build is deliberately NOT continue-on-error, otherwise a
      # genuine compile failure would be reported as a green check.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: mod-${{ steps.mc.outputs.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: warn

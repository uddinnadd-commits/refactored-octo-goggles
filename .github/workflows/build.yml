name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Forge 1.20.1 -> JDK 17, Forge 1.21.1 -> JDK 21.
      # We read the exact `minecraft_version=` property instead of grepping for
      # "1.21", because Forge templates contain minecraft_version_range=[1.20.1,1.21)
      # which falsely matches "1.21" and would select JDK 21 for a 1.20.1 project.
      - name: Detect Minecraft version and required JDK
        id: mc
        run: |
          MC=""
          if [ -f gradle.properties ]; then
            MC=$(grep -E '^[[:space:]]*minecraft_version[[:space:]]*=' gradle.properties | head -1 | cut -d= -f2 | tr -d ' \r')
          fi
          if [ -z "$MC" ]; then
            MC=$(grep -oE 'net\.minecraftforge:forge:1\.[0-9]+(\.[0-9]+)?' build.gradle 2>/dev/null | head -1 | sed 's/.*forge://')
          fi
          case "$MC" in
            1.21*|1.22*|1.23*) JAVA=21 ;;
            *)                 JAVA=17 ;;
          esac
          echo "Detected Minecraft '${MC:-unknown}' -> JDK $JAVA"
          echo "mc=${MC:-unknown}" >> "$GITHUB_OUTPUT"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.mc.outputs.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.mc.outputs.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        continue-on-error: true
        with:
          cache-disabled: true
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: mod-${{ steps.mc.outputs.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: warn

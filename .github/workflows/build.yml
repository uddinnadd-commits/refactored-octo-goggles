name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Locate the Gradle project. It may sit in the repo root or inside a
      # subfolder (common when a zipped mod folder was pushed as-is).
      - name: Locate project and wrapper
        id: proj
        run: |
          BG=$(find . -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/node_modules/*' | sort | head -1)
          if [ -z "$BG" ]; then
            echo "::error::No build.gradle found in the repository. Files present:"
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$BG")
          echo "Project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          if [ -f "$DIR/gradlew" ] && [ -f "$DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::gradlew / gradle-wrapper.jar not committed; falling back to a CI-provided Gradle. Commit the wrapper files to remove this warning."
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
          fi

      # Forge 1.20.1 -> JDK 17 (+ Gradle 8.1.1), Forge 1.21.1 -> JDK 21 (+ Gradle 8.8).
      - name: Detect Minecraft version and required JDK
        id: mc
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          MC=""
          if [ -f gradle.properties ]; then
            MC=$(grep -E '^[[:space:]]*minecraft_version[[:space:]]*=' gradle.properties | head -1 | cut -d= -f2 | tr -d ' \r')
          fi
          if [ -z "$MC" ]; then
            MC=$(grep -oE 'net\.minecraftforge:forge:1\.[0-9]+(\.[0-9]+)?' build.gradle 2>/dev/null | head -1 | sed 's/.*forge://')
          fi
          case "$MC" in
            1.21*|1.22*|1.23*) JAVA=21; GRADLE=8.8 ;;
            *)                 JAVA=17; GRADLE=8.1.1 ;;
          esac
          echo "Detected Minecraft '${MC:-unknown}' -> JDK $JAVA, fallback Gradle $GRADLE"
          echo "mc=${MC:-unknown}" >> "$GITHUB_OUTPUT"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"
          echo "gradle=$GRADLE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.mc.outputs.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.mc.outputs.java }}

      # Only pins a Gradle version when the project has no wrapper of its own.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        continue-on-error: true
        with:
          gradle-version: ${{ steps.proj.outputs.wrapper == 'false' && steps.mc.outputs.gradle || '' }}
          cache-disabled: true
          validate-wrappers: false

      - name: Build (wrapper)
        if: steps.proj.outputs.wrapper == 'true'
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew build --no-daemon --stacktrace

      - name: Build (CI-provided Gradle)
        if: steps.proj.outputs.wrapper == 'false'
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          gradle --version
          gradle build --no-daemon --stacktrace

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: mod-${{ steps.mc.outputs.mc }}
          path: |
            ${{ steps.proj.outputs.dir }}/build/libs/*.jar
            !${{ steps.proj.outputs.dir }}/build/libs/*-sources.jar
            !${{ steps.proj.outputs.dir }}/build/libs/*-javadoc.jar
          if-no-files-found: warn
